<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Morning Checklist</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6fa;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-top: 0;
      color: #1d4f7c;
    }
    label {
      display: block;
      padding: 12px 0;
      font-size: 18px;
      border-bottom: 1px solid #e5e5e5;
      cursor: pointer;
    }
    input {
      transform: scale(1.4);
      margin-right: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Morning Checklist</h1>

    <label><input type="checkbox"> Sterilization check</label>
    <label><input type="checkbox"> Review today's patients</label>
    <label><input type="checkbox"> Check implant stock</label>
    <label><input type="checkbox"> Staff briefing</label>
  </div>
</body>
</html>
